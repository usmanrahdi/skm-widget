<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#eff6ff,#ffffff);
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    text-align:center;
}

.title{
    font-size:14px;
    color:#64748b;
    margin-bottom:10px;
}

.score{
    font-size:56px;
    font-weight:bold;
    color:#2563eb;
}

.sub{
    color:#64748b;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
    margin-top:10px;
}

.grid{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.box{
    background:#f1f5f9;
    padding:12px 18px;
    border-radius:10px;
}

.label{
    font-size:13px;
    color:#64748b;
}

.value{
    font-size:18px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

<div class="title">
INDEKS KEPUASAN MASYARAKAT
</div>

<div class="score" id="score">
...
</div>

<div class="sub">
/ 100
</div>

<div id="badge"></div>

<div class="grid">

<div class="box">
<div class="label">Responden</div>
<div class="value" id="responden">-</div>
</div>

<div class="box">
<div class="label">Grade</div>
<div class="value" id="grade">-</div>
</div>

</div>

</div>

<script>

async function load(){

const r=await fetch("https://skm.setdes.id/api/chart-data");
const j=await r.json();

const score=j.data.ikmScore;
const kategori=j.data.ikmCategory.label;
const grade=j.data.ikmCategory.grade;
const responden=j.data.totalResponses;

document.getElementById("score").innerHTML=score;
document.getElementById("grade").innerHTML=grade;
document.getElementById("responden").innerHTML=responden;

let color="#2563eb";
let bg="#dbeafe";

if(grade=="A"){color="#059669";bg="#d1fae5";}
if(grade=="B"){color="#2563eb";bg="#dbeafe";}
if(grade=="C"){color="#d97706";bg="#fef3c7";}
if(grade=="D"){color="#dc2626";bg="#fee2e2";}

document.getElementById("badge").innerHTML=
`<span class="badge" style="background:${bg};color:${color}">
${grade} - ${kategori}
</span>`;

}

load();

</script>

</body>
</html>
