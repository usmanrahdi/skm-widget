<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

:root{
--primary:#2563eb;
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--border:#e2e8f0;
}

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
margin:0;
padding:20px;
background:var(--bg);
color:var(--text);
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:var(--card);
border-radius:14px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
margin-bottom:20px;
}

.hero{
text-align:center;
padding:35px 20px;
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
}

.hero .score{
font-size:72px;
font-weight:700;
line-height:1;
}

.hero .label{
opacity:0.9;
margin-bottom:10px;
}

.badge{
display:inline-block;
background:rgba(255,255,255,0.2);
padding:8px 18px;
border-radius:30px;
margin-top:15px;
font-weight:500;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center;
border:1px solid var(--border);
}

.stat .value{
font-size:26px;
font-weight:600;
margin-top:5px;
}

.section-title{
font-size:20px;
font-weight:600;
margin-bottom:15px;
}

.item{
margin-bottom:18px;
}

.item-header{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

.bar{
height:12px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
background:linear-gradient(90deg,#2563eb,#60a5fa);
border-radius:20px;
transition:width 0.6s ease;
}

.footer{
text-align:center;
font-size:13px;
color:var(--muted);
margin-top:15px;
}

</style>

</head>
<body>

<div class="container">

<div class="card hero">

<div class="label">
INDEKS KEPUASAN MASYARAKAT
</div>

<div class="score" id="score">...</div>

<div>/100</div>

<div class="badge" id="badge"></div>

</div>


<div class="grid">

<div class="stat">
<div>Total Responden</div>
<div class="value" id="responden"></div>
</div>

<div class="stat">
<div>Kategori</div>
<div class="value" id="kategori"></div>
</div>

<div class="stat">
<div>Grade Mutu</div>
<div class="value" id="grade"></div>
</div>

</div>


<div class="card">

<div class="section-title">
Detail Unsur Pelayanan
</div>

<div id="unsur"></div>

<div class="footer">
Data diperbarui otomatis dari sistem SKM
</div>

</div>

</div>


<script>

async function loadSKM(){

const res = await fetch(
"https://skm.setdes.id/api/chart-data"
);

const json = await res.json();

const d = json.data;


document.getElementById("score")
.innerHTML = d.ikmScore;


document.getElementById("badge")
.innerHTML =
d.ikmCategory.grade
+ " • "
+ d.ikmCategory.label;


document.getElementById("responden")
.innerHTML = d.totalResponses;


document.getElementById("kategori")
.innerHTML = d.ikmCategory.label;


document.getElementById("grade")
.innerHTML = d.ikmCategory.grade;


let html = "";

for(const key in d.averagePerUnsur){

const u = d.averagePerUnsur[key];

const percent = (u.average / 4) * 100;

html += `
<div class="item">

<div class="item-header">

<div>${u.label}</div>

<div>${u.average}</div>

</div>

<div class="bar">

<div class="fill"
style="width:${percent}%">
</div>

</div>

</div>
`;

}

document.getElementById("unsur")
.innerHTML = html;

}

loadSKM();

</script>

</body>
</html>
