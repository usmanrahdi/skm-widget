<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
    text-align: center;
}

.box{
    border: 1px solid #2c7be5;
    background: #f4f8ff;
    border-radius: 8px;
    padding: 15px;
}

.label{
    font-size: 14px;
    color: #555;
}

.nilai{
    font-size: 32px;
    font-weight: bold;
    color: #2c7be5;
    margin-top: 5px;
}
</style>

</head>
<body>

<div class="box">
    <div class="label">Nilai SKM Terbaru</div>
    <div class="nilai" id="nilai">Loading...</div>
</div>

<script>

async function loadSKM() {

    try {

        const response = await fetch('https://skm.setdes.id/api/chart-data');
        const json = await response.json();

        let nilai = "Tidak tersedia";

        // FORMAT 1: { data: [85, 87, 88] }
        if (json.data && json.data.length > 0) {
            nilai = json.data[json.data.length - 1];
        }

        // FORMAT 2: array object
        else if (Array.isArray(json) && json.length > 0) {

            let last = json[json.length - 1];

            nilai =
                last.value ??
                last.nilai ??
                last.skm ??
                last.score ??
                Object.values(last)[1];
        }

        // FORMAT 3: langsung array angka
        else if (Array.isArray(json)) {
            nilai = json[json.length - 1];
        }

        document.getElementById("nilai").innerHTML = nilai;

    }
    catch (e) {

        document.getElementById("nilai").innerHTML = "Tidak tersedia";

    }

}

loadSKM();

</script>

</body>
</html>
