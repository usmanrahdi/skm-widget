<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
padding:15px;
background:#f8fafc;
}

.card{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
margin-bottom:15px;
}

.center{text-align:center;}

.score{
font-size:48px;
font-weight:bold;
color:#2563eb;
}

.grade{
font-size:18px;
margin-top:5px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.box{
background:#f1f5f9;
padding:12px;
border-radius:8px;
text-align:center;
}

.label{
font-size:14px;
color:#64748b;
}

.value{
font-size:20px;
font-weight:bold;
margin-top:5px;
}

.item{
margin-top:10px;
}

.bar{
height:8px;
background:#e2e8f0;
border-radius:5px;
overflow:hidden;
margin-top:4px;
}

.fill{
height:100%;
background:#2563eb;
}

</style>

</head>
<body>

<div class="card center">

<div>Indeks Kepuasan Masyarakat (IKM)</div>

<div class="score" id="score">...</div>

<div class="grade" id="grade"></div>

<div class="grid">

<div class="box">
<div class="label">Responden</div>
<div class="value" id="responden">-</div>
</div>

<div class="box">
<div class="label">Kategori</div>
<div class="value" id="kategori">-</div>
</div>

<div class="box">
<div class="label">Grade</div>
<div class="value" id="grade2">-</div>
</div>

</div>

</div>

<div class="card">

<div><b>Detail Unsur Pelayanan</b></div>

<div id="unsur"></div>

</div>

<script>

async function load(){

let r=await fetch("https://skm.setdes.id/api/chart-data");
let j=await r.json();

let d=j.data;

document.getElementById("score").innerHTML=d.ikmScore;
document.getElementById("grade").innerHTML=d.ikmCategory.label+" (Grade "+d.ikmCategory.grade+")";

document.getElementById("responden").innerHTML=d.totalResponses;
document.getElementById("kategori").innerHTML=d.ikmCategory.label;
document.getElementById("grade2").innerHTML=d.ikmCategory.grade;

let html="";

let unsur=d.averagePerUnsur;

for(let key in unsur){

let u=unsur[key];

let persen=(u.average/4)*100;

html+=`
<div class="item">
<div>${u.label} : <b>${u.average}</b></div>
<div class="bar">
<div class="fill" style="width:${persen}%"></div>
</div>
</div>
`;

}

document.getElementById("unsur").innerHTML=html;

}

load();

</script>

</body>
</html>
