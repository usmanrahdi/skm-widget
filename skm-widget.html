<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--primary:#2563eb;
--primary2:#3b82f6;
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--border:#e2e8f0;
}

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
margin:0;
padding:20px;
background:var(--bg);
color:var(--text);
}

.container{
max-width:900px;
margin:auto;
padding-bottom:30px;
}

.card{
background:var(--card);
border-radius:16px;
padding:28px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
margin-bottom:30px;
}

.hero{
text-align:center;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
padding:40px;
}

.score{
font-size:72px;
font-weight:700;
}

.badge{
margin-top:10px;
display:inline-block;
background:rgba(255,255,255,0.2);
padding:8px 20px;
border-radius:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:25px;
}

.stat{
background:#f8fafc;
padding:20px;
border-radius:12px;
border:1px solid var(--border);
text-align:center;
}

.stat .value{
font-size:26px;
font-weight:600;
margin-top:5px;
}

.section-title{
font-size:20px;
font-weight:600;
margin-bottom:20px;
}

.chart-box{
width:220px;
margin:auto;
}

.item{
margin-bottom:18px;
}

.item-header{
display:flex;
justify-content:space-between;
margin-bottom:6px;
font-size:14px;
}

.bar{
height:12px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
background:linear-gradient(90deg,var(--primary),#60a5fa);
border-radius:20px;
transition:width 1s;
}

.footer{
text-align:center;
font-size:13px;
color:var(--muted);
margin-top:20px;
}

</style>

</head>
<body>

<div class="container">

<div class="card hero">

<div>INDEKS KEPUASAN MASYARAKAT</div>

<div class="score" id="score">...</div>

<div>/100</div>

<div class="badge" id="badge"></div>

</div>


<div class="grid">

<div class="stat">
<div>Total Responden</div>
<div class="value" id="responden"></div>
</div>

<div class="stat">
<div>Kategori</div>
<div class="value" id="kategori"></div>
</div>

<div class="stat">
<div>Mutu Pelayanan</div>
<div class="value" id="grade"></div>
</div>

</div>


<div class="card">

<div class="section-title">
Distribusi Kepuasan
</div>

<div class="chart-box">
<canvas id="donut"></canvas>
</div>

</div>


<div class="card">

<div class="section-title">
Detail Unsur Pelayanan
</div>

<div id="unsur"></div>

<div class="footer">
Data realtime dari sistem SKM
</div>

</div>

</div>



<script>

async function loadSKM(){

const res = await fetch(
"https://skm.setdes.id/api/chart-data"
);

const json = await res.json();

const d = json.data;



// SCORE

document.getElementById("score").innerHTML =
d.ikmScore;

document.getElementById("badge").innerHTML =
d.ikmCategory.grade + " • " + d.ikmCategory.label;

document.getElementById("responden").innerHTML =
d.totalResponses;

document.getElementById("kategori").innerHTML =
d.ikmCategory.label;

document.getElementById("grade").innerHTML =
d.ikmCategory.grade;



// DONUT CHART

const dist = d.ratingDistribution;

new Chart(
document.getElementById("donut"),
{
type:"doughnut",

data:{
labels:[
"Tidak Baik",
"Kurang Baik",
"Baik",
"Sangat Baik"
],

datasets:[{
data:[
dist["1"]||0,
dist["2"]||0,
dist["3"]||0,
dist["4"]||0
],

backgroundColor:[
"#ef4444",
"#f59e0b",
"#3b82f6",
"#10b981"
]
}]
},

options:{
plugins:{
legend:{
position:"bottom"
}
},

cutout:"65%"
}
}
);



// UNSUR

let html="";

for(const key in d.averagePerUnsur){

const u = d.averagePerUnsur[key];

const percent = (u.average / 4) * 100;

html += `
<div class="item">

<div class="item-header">

<div>${u.label}</div>

<div>${u.average}</div>

</div>

<div class="bar">

<div class="fill"
style="width:${percent}%">
</div>

</div>

</div>
`;

}

document.getElementById("unsur").innerHTML = html;


// AUTO HEIGHT IFRAME

setTimeout(()=>{

const height =
document.body.scrollHeight;

window.parent.postMessage(
{
frameHeight:height
},
"*"
);

},500);

}

loadSKM();

</script>


<script>

// LISTENER AUTO HEIGHT

window.addEventListener(
"message",
function(e){

if(e.data.frameHeight){

document.querySelector("iframe").style.height =
e.data.frameHeight + "px";

}

}
);

</script>


</body>
</html>
