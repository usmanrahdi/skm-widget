<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f1f5f9;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:14px;
padding:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
}

.title{
font-size:15px;
color:#64748b;
margin-bottom:10px;
}

.score{
font-size:64px;
font-weight:bold;
color:#2563eb;
line-height:1;
}

.max{
color:#64748b;
margin-bottom:10px;
}

.badge{
display:inline-block;
padding:8px 18px;
border-radius:30px;
font-weight:600;
margin-top:10px;
font-size:14px;
}

.grid{
display:flex;
gap:15px;
justify-content:center;
margin-top:20px;
flex-wrap:wrap;
}

.box{
background:#f1f5f9;
padding:12px 18px;
border-radius:10px;
min-width:120px;
}

.label{
font-size:13px;
color:#64748b;
}

.value{
font-size:20px;
font-weight:bold;
margin-top:4px;
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<div class="title">
INDEKS KEPUASAN MASYARAKAT (IKM)
</div>

<div class="score" id="score">
...
</div>

<div class="max">
/ 100
</div>

<div id="badge"></div>

<div class="grid">

<div class="box">
<div class="label">Responden</div>
<div class="value" id="responden">-</div>
</div>

<div class="box">
<div class="label">Kategori</div>
<div class="value" id="kategori">-</div>
</div>

<div class="box">
<div class="label">Grade</div>
<div class="value" id="grade">-</div>
</div>

</div>

</div>

</div>

<script>

async function load(){

const r = await fetch("https://skm.setdes.id/api/chart-data");
const j = await r.json();

const score = j.data.ikmScore;
const kategori = j.data.ikmCategory.label;
const grade = j.data.ikmCategory.grade;
const responden = j.data.totalResponses;

document.getElementById("score").innerHTML = score;
document.getElementById("kategori").innerHTML = kategori;
document.getElementById("grade").innerHTML = grade;
document.getElementById("responden").innerHTML = responden;

let color="#2563eb";
let bg="#dbeafe";

if(grade=="A"){color="#059669";bg="#d1fae5";}
if(grade=="B"){color="#2563eb";bg="#dbeafe";}
if(grade=="C"){color="#d97706";bg="#fef3c7";}
if(grade=="D"){color="#dc2626";bg="#fee2e2";}

document.getElementById("badge").innerHTML=
`<span class="badge" style="background:${bg};color:${color}">
${grade} - ${kategori}
</span>`;

}

load();

</script>

</body>
</html>
