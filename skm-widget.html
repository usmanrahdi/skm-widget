<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
    text-align: center;
}

.box{
    border: 1px solid #2c7be5;
    background: #f4f8ff;
    border-radius: 8px;
    padding: 15px;
}

.label{
    font-size: 14px;
    color: #555;
}

.nilai{
    font-size: 32px;
    font-weight: bold;
    color: #2c7be5;
    margin-top: 5px;
}

.kategori{
    font-size: 16px;
    margin-top: 5px;
}
</style>

</head>
<body>

<div class="box">
    <div class="label">Nilai SKM Terbaru</div>
    <div class="nilai" id="nilai">Loading...</div>
    <div class="kategori" id="kategori"></div>
</div>

<script>

async function loadSKM() {

    try {

        const res = await fetch("https://skm.setdes.id/api/chart-data");
        const json = await res.json();

        if(json.success && json.data){

            const nilai = json.data.ikmScore;
            const kategori = json.data.ikmCategory.label;
            const grade = json.data.ikmCategory.grade;

            document.getElementById("nilai").innerHTML = nilai;
            document.getElementById("kategori").innerHTML =
                kategori + " (Grade " + grade + ")";

        }
        else{
            document.getElementById("nilai").innerHTML = "Tidak tersedia";
        }

    }
    catch{
        document.getElementById("nilai").innerHTML = "Tidak tersedia";
    }

}

loadSKM();

</script>

</body>
</html>
